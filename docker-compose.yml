services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: plagiarism_detector
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plagiarism_detector"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: >
      sh -c "npm install &&
             npx turbo build --filter='./packages/*' &&
             npm run dev -w api"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/plagiarism_detector
      REDIS_URL: redis://redis:6379
      PORT: 3001
    ports:
      - "3001:3001"
    volumes:
      - .:/repo
      - api_node_modules:/repo/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: >
      sh -c "npm install &&
             npm run dev -w web -- --host 0.0.0.0"
    environment:
      API_URL: http://api:3001
    ports:
      - "5173:5173"
    volumes:
      - .:/repo
      - web_node_modules:/repo/node_modules
    depends_on:
      - api

  seaweedfs:
    image: chrislusf/seaweedfs:3.71
    command: server -s3 -s3.config=/etc/seaweedfs/s3-config.json -dir=/data
    ports:
      - "8333:8333"
    volumes:
      - seaweed_data:/data
      - ./infra/seaweedfs/s3-config.json:/etc/seaweedfs/s3-config.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  api_node_modules:
  web_node_modules:
  seaweed_data:
